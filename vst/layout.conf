knob cx=485 cy=240 r=52 label="FEEDBACK" key=feedback
knob cx=795 cy=240 r=51 label="ENV TIME" key=env_time
knob cx=1105 cy=240 r=51 label="RELEASE" key=rel_scale
#@frame x=20 y=438 w=1240 h=262 title="PLAY"
