# Okto MPC skin layout: 4 x 2 controls per tab at fixed positions, in the order of the Force's
# eight knobs (Q-Links); r=48 and the grid are those of Rattler / carp 2000 (filmstrip well below
# 16384 px). Frame titles empty: the tab name is already in the tab bar.
# EDIT picks the operator (OP 1-8) or the pitch envelope (PITCH); OP, OP MOD, MATRIX, ENV, LEVELS
# and TIMES then show and turn that one. On OP / OP MOD / ENV the first Q-Link turns EDIT itself;
# on MATRIX, LEVELS and TIMES all eight Q-Links are values, EDIT is the field at the top.
# Buttons and switches stay off the Q-Links (PRESET: the knob browses, LOAD and SAVE act; LFO: KEY SYNC is touch only).
# Palette: graphite panel, warm white print, amber accents.
style=td3
font_label=fonts/DejaVuSans-Bold.ttf
label_scale=1.25
scale_names=1
theme_bg=1b1c20
theme_panel=2a2c33
theme_line=121317
theme_ink=f3efe6
theme_ink_dim=b8b2a4
theme_ink_faint=6a6760
theme_accent=ff9a2e
theme_accent_hi=ffc070
theme_knob_face=121317
theme_knob_ring=000000
theme_bar=ff9a2e
theme_seg_active=ff9a2e
theme_seg_inactive=121317
theme_seg_active_tx=111111
theme_btn_text=111111
theme_well=0e0f12
theme_knob_off=55565c
theme_tab_on=ff9a2e
theme_tab_on_tx=111111
theme_lcd=17130c
theme_box=202227
theme_btn_bg=f3efe6
theme_chrome_ink=f3efe6
theme_go_on=ff9a2e
theme_go_off=ffc070
theme_tabs=ff9a2e

