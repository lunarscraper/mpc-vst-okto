# Okto MPC skin layout, Force-Look (1.3.0): large type, big touch targets and a colourful page of its own (gradient, light rays,
# dark panels behind the controls), arc knobs, white slider caps (the envelope levels are faders), big rounded buttons and option segments. 12 tabs as in 1.2.0;
# each page: its name at the top left, two framed rows = Q-Links 1-4 and 5-8.
# EDIT (OP 1-8, PITCH) sits as a row of big segments at the top right of every page that edits one operator, like the
# Force's own sub-page row: one tap picks the operator. OP, OP MOD, ENV and SHP MOD show it large in the first slot,
# where the first Q-Link turns it, as before; on MATRIX, LEVELS and TIMES all eight Q-Links are values.
# Buttons and switches stay off the Q-Links (RANDOM, UNDO, LOAD, SAVE and LFO KEY SYNC are touch only).
# force_look.py (vst.json "skin_post") repaints the generator's images and draws the #@title / #@frame / #@text
# lines (comments for the generator); coordinates in shadow pixels.
style=plain
font_label=fonts/DejaVuSans-Bold.ttf
label_scale=1.5
scale_names=1
theme_bg=3a1660
theme_ink=ffffff
theme_ink_dim=7ff6ff
theme_accent=4ff0ff
theme_lcd=120630
theme_panel=3a1660
theme_box=3a1660
theme_accent_hi=ffffff
theme_ink_faint=3a1660
#@look bg_top=160a3a bg_bottom=5a1a6e glow=d23cff ray1=ff4fd8 ray2=4fc8ff ray_alpha=45 panel=0a0420 frame=4ff0ff frame_text=07122a title=ffffff sub=ff9fe8 text=f4eeff knob_face=2c1458 knob_rim=6a3aa8 knob_track=43267a knob_arc=ff5fd8 pointer=ffffff slider_track=43267a slider_fill=ff5fd8 slider_cap=ffffff slider_cap_line=2c1458 btn=5a2a9a btn_ring=4ff0ff btn_text=ffffff btn_down=4ff0ff btn_down_text=07122a seg=2c1458 seg_ring=6a4ab0 seg_text=ece4ff seg_on=ff5fd8 seg_on_ring=ffffff seg_on_text=2a0626 pill_off=2c1458 pill_on=ff5fd8 pill_dot=ffffff list=120630 list_ring=4ff0ff opt=221048 opt_text=f4eeff opt_on=4ff0ff opt_on_text=07122a

[tab MAIN]
