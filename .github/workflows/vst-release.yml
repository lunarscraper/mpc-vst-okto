name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.1.0
        required: true
        default: 0.1.0
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: true

jobs:
  okto:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@59d9c25f4f8c09cc15b05892d5a765b1a280dc43
    permissions:
      contents: write
    with:
      tag: okto-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 59d9c25f4f8c09cc15b05892d5a765b1a280dc43
      vst_dir: vst
      build: bash vst/build.sh
      host_test: bash vst/test.sh
      plugin_id: okto
      license: MIT
      about: 8-operator FM synthesizer after libfmsynth - free 8 x 8 modulation matrix, every operator a carrier with its own pan, six waveforms, envelopes with 8 breakpoints that loop or step in tempo divisions like a sequencer (in the manner of FM8), pitch envelope, LFO, mono/legato/unison; 32 preset slots with LOAD/SAVE.
      dry_run: ${{ inputs.dry_run }}
